name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\validate-plugin.ps1
      - name: Test core tools
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-core-tools.ps1
      - name: Test migration surface
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-migration-surface.ps1
